<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый пароль — Ноготочки</title>
<meta name="description" content="Смена пароля по ссылке из письма — бьюти-студия «Ноготочки».">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marck+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="auth-header">
  <div class="auth-header__inner">
    <a class="back" data-screen="L1" href="#">
      <svg class="icon icon--s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      Назад
    </a>
    <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Переключить тему">
      <span class="theme-toggle__icon" id="theme-icon" aria-hidden="true"></span>
      <span class="theme-toggle__label" id="theme-label">Дневная</span>
    </button>
  </div>
</header>

<main class="auth auth--narrow">
  <div class="auth__col">
    <p class="auth-step overline">шаг 2 · новый пароль</p>
    <div class="auth-card">
      <div class="auth-brand">
          <svg class="icon--xl" viewBox="0 0 100 100" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="50" cy="52" r="34"></circle>
              <path d="M40 70 C38 56 40 44 43 36"></path>
              <path d="M50 71 C50 56 53 44 56 37"></path>
              <path d="M59 71 C60 58 63 49 66 43"></path>
              <path d="M37 68 C37 77 42 83 50 83 C58 83 63 77 63 68"></path>
              <path d="M50 20 L52 27.5 L59.5 29.5 L52 31.5 L50 39 L48 31.5 L40.5 29.5 L48 27.5 Z" fill="currentColor" stroke="none"></path>
            </g>
          </svg>
          <span class="auth-brand__word">Ноготочки</span>
        </div>

      <!-- Пока идёт проверка ссылки, формы не показываем: иначе человек
           введёт пароль дважды и только потом узнает, что ссылка мертва. -->
      <div class="result" id="checking">
        <p>Проверяем ссылку…</p>
      </div>

      <div class="auth-head" id="head" hidden>
        <h1>Придумайте новый пароль</h1>
        <p>После сохранения войдите с ним в личный кабинет</p>
      </div>

      <form class="form" id="form" autocomplete="on" hidden>
        <label class="field">
          <span class="field__label">Новый пароль</span>
          <span class="pass">
            <input class="input" type="password" name="password"
                   autocomplete="new-password" aria-describedby="hint-password rules">
            <button class="pass__toggle" type="button"></button>
          </span>
          <span class="field__hint" id="hint-password" hidden></span>
        </label>

        <label class="field">
          <span class="field__label">Повторите пароль</span>
          <span class="pass">
            <input class="input" type="password" name="password2"
                   autocomplete="new-password" aria-describedby="hint-password2">
            <button class="pass__toggle" type="button"></button>
          </span>
          <span class="field__hint" id="hint-password2" hidden></span>
        </label>

        <div class="rules" id="rules">
          <p class="overline">требования к паролю</p>
          <span class="rule" data-min="8" data-ok="false"><i class="rule__mark"></i>Не короче восьми символов</span>
        </div>

        <div class="notice notice--error" id="form-error" role="alert" hidden></div>

        <button class="btn btn--primary btn--wide" type="submit">
          <i class="spinner" hidden aria-hidden="true"></i>
          <span class="btn__label">Сохранить пароль</span>
        </button>
      </form>

      <div class="result" id="done" hidden>
        <span class="result__mark result__mark--ok">
          <svg class="icon icon--l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <h2>Пароль изменён</h2>
        <p id="done-text"></p>
        <a class="btn btn--primary btn--wide" data-screen="C1" href="#">Войти с новым паролем</a>
      </div>

      <div class="result" id="dead" hidden>
        <span class="result__mark result__mark--warn">
          <svg class="icon icon--l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5l3 2"></path></svg>
        </span>
        <h2>Ссылка больше не действует</h2>
        <p id="dead-text"></p>
        <a class="btn btn--primary btn--wide" data-screen="C3" href="#">Запросить новую ссылку</a>
      </div>

      <p class="auth-foot"><a data-screen="C1" href="#">Вернуться ко входу</a></p>
    </div>
  </div>
</main>

<script type="module" src="reset-password.js"></script>
</body>
</html>
